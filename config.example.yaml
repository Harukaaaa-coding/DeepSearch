# Copy to config.yaml and fill in a key issued by the selected provider.
# Never commit config.yaml. An empty key keeps model synthesis unconfigured.
report_model:
  provider: bai
  model: gpt-5.2
  api_key: ""

# Optional image generation: uncomment only if you intend to use a paid image API.
# PRD generation can automatically request prototype and architecture images.
# An empty image key reuses report_model.api_key; use a B.AI key here.
